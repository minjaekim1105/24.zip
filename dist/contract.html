<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>계약 전 지원 확인 | 24.zip</title><link rel="stylesheet" href="contract.css"><script defer src="local-housing-support.js"></script><script defer src="contract.js"></script></head><body><main><a href="/?screen=home">← 24.zip v3 홈</a>
<h1>계약 전에, 이 집으로 받을 수 있는 지원을 확인해요</h1>
<p>집이 있는 구를 고르면 지역 지원 정보를 바로 볼 수 있어요. 보증금과 월세까지 입력하면 서울시 지원 조건도 비교할 수 있어요.</p>
<form id="check" autocomplete="off"><fieldset><legend>관심 주택</legend><label>관심 주택의 자치구<select required name="area"><option value="">집이 있는 구 선택</option><option>강남구</option><option>강동구</option><option>강북구</option><option>강서구</option><option>관악구</option><option>광진구</option><option>구로구</option><option>금천구</option><option>노원구</option><option>도봉구</option><option>동대문구</option><option>동작구</option><option>마포구</option><option>서대문구</option><option>서초구</option><option>성동구</option><option>성북구</option><option>송파구</option><option>양천구</option><option>영등포구</option><option>용산구</option><option>은평구</option><option>종로구</option><option>중구</option><option>중랑구</option><option value="other">서울 외 지역</option></select></label><label>보증금 (만원)<input required name="deposit" type="number" min="0" max="10000000" step="0.0001"></label><label>월세 (만원, 관리비 제외)<input required name="rent" type="number" min="0" max="1000000" step="0.0001"></label></fieldset><section id="local-support" aria-live="polite"></section>
<fieldset><legend>신청인 조건</legend><p class="privacy">소득·출생연도는 이 화면에서만 비교하며 서버 전송이나 저장을 하지 않습니다.</p><label>출생연도 (선택)<input name="year" type="number" min="1900" max="2026" placeholder="예: 2001"></label><label>해당 공고 기준 가구 중위소득 비율<select name="income"><option value="">모름</option><option value="low">48% 이하</option><option value="mid">48% 초과 ~ 150% 이하</option><option value="high">150% 초과</option></select></label></fieldset>
<button>이 집의 지원 조건 비교</button></form><section id="results" aria-live="polite"></section>
<details><summary>공고 갱신 기준</summary><p>서울주거포털·청년몽땅정보통 공식 공고를 기준으로 합니다. 운영 검수 계획은 매주 월요일, 모집 중에는 업무일마다입니다. 새 회차는 정정 공고와 예외 조건을 원문과 대조한 뒤 반영합니다.</p></details></main></body></html>
