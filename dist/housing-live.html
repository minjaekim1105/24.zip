<!doctype html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#123960">
    <title>24.zip | 서울 청년 맞춤 주거 탐색</title>
    <style>
        :root {
            --navy: #102e52;
            --blue: #2769ae;
            --sky: #e8f3ff;
            --edge: #d6e3f1;
            --ink: #142d4f;
            --muted: #667c96;
            --bg: #f1f6fc;
            --green: #168452;
            --red: #bb4343
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: linear-gradient(135deg, #eaf3fd, #f7faff 46%, #e4effa);
            color: var(--ink);
            font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            line-height: 1.55
        }

        button,
        input,
        select {
            font: inherit
        }

        button {
            cursor: pointer
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible {
            outline: 3px solid #8abdf7;
            outline-offset: 2px
        }

        .shell {
            max-width: 1150px;
            margin: 0 auto;
            min-height: 100vh;
            padding: 18px 20px 45px
        }

        .topbar {
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 19px;
            background: #fff;
            box-shadow: 0 7px 32px #31578412;
            padding: 0 26px;
            margin-bottom: 24px
        }

        .brand {
            font-size: 29px;
            line-height: 1;
            font-weight: 900;
            letter-spacing: -1.9px;
            color: var(--navy);
            border: 0;
            background: none;
            padding: 3px
        }

        .brand .roof {
            color: #3e8dcc
        }

        .nav {
            display: flex;
            gap: 8px;
            align-items: center
        }

        .nav button {
            background: transparent;
            border: 0;
            color: var(--muted);
            padding: 9px 13px;
            border-radius: 8px;
            font-weight: 650
        }

        .nav button:hover {
            background: #edf4fc;
            color: var(--navy)
        }

        .tag {
            display: inline-flex;
            padding: 5px 11px;
            background: #e6f2ff;
            color: #2464a1;
            border: 1px solid #c8e1fd;
            border-radius: 100px;
            font-weight: 750;
            font-size: 12px
        }

        .main {
            max-width: 940px;
            margin: auto
        }

        .panel {
            background: white;
            border: 1px solid #d9e5f2;
            border-radius: 23px;
            box-shadow: 0 12px 32px #28518111;
            padding: 34px;
            margin: 20px auto
        }

        .heading h1 {
            font-size: clamp(25px, 4vw, 37px);
            line-height: 1.24;
            letter-spacing: -1.2px;
            margin: 10px 0
        }

        .heading p {
            color: var(--muted);
            margin: 0 0 18px
        }

        .lead {
            color: #5b7391
        }

        .btn {
            padding: 13px 22px;
            border-radius: 12px;
            font-weight: 800;
            border: 1px solid #cbd9e9;
            background: #fff;
            color: var(--navy);
            transition: transform .15s, background .15s
        }

        .btn:hover {
            transform: translateY(-1px);
            background: #f1f7ff
        }

        .btn.primary {
            background: linear-gradient(125deg, #0b2d50, #215e95);
            border-color: #153e66;
            color: #fff
        }

        .btn.primary:hover {
            background: #245f98
        }

        .btn.secondary {
            background: #eaf3fd;
            border-color: #cfe3f9
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed;
            transform: none
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap
        }

        .actions .btn {
            flex: 1;
            min-width: 170px
        }

        .progress {
            display: flex;
            justify-content: center;
            gap: 10px;
            align-items: center;
            margin: 6px 0 24px;
            flex-wrap: wrap
        }

        .step {
            display: flex;
            align-items: center;
            gap: 7px;
            color: #879bb2;
            font-size: 13px;
            font-weight: 800
        }

        .num {
            width: 31px;
            height: 31px;
            border-radius: 50%;
            border: 1px solid #d4e1ed;
            display: grid;
            place-items: center;
            background: #fff
        }

        .step.active {
            color: var(--navy)
        }

        .step.active .num {
            background: var(--navy);
            color: #fff
        }

        .connector {
            height: 1px;
            width: 25px;
            background: #bdd0e3
        }

        .formgrid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px
        }

        .field>label,
        .field>strong {
            font-weight: 800;
            font-size: 14px
        }

        .field input,
        .field select {
            width: 100%;
            padding: 13px 15px;
            border-radius: 10px;
            border: 1px solid #cfdced;
            background: #fff;
            min-height: 49px;
            color: var(--ink)
        }

        .helper {
            font-size: 12px;
            color: var(--muted)
        }

        .subhead {
            font-size: 17px;
            margin: 28px 0 11px;
            font-weight: 900
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px
        }

        .chip {
            border: 1px solid #c8d9eb;
            color: #27466a;
            background: #fff;
            padding: 10px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700
        }

        .chip.selected {
            background: var(--blue);
            border-color: var(--blue);
            color: #fff
        }

        .hero {
            overflow: hidden;
            padding: 0
        }

        .hero-art {
            height: 340px;
            position: relative;
            overflow: hidden;
            background: linear-gradient(180deg, #a9d9fd 0%, #e4f4ff 63%, #9abfcd 100%)
        }

        .hero-art:before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 78% 16%, #fff8 0 48px, transparent 50px)
        }

        .skyline {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 95%
        }

        .hero-content {
            text-align: center;
            padding: 30px 25px 38px
        }

        .hero-content h1 {
            font-size: clamp(30px, 4.5vw, 47px);
            letter-spacing: -1.6px;
            margin: 8px 0
        }

        .hero-content p {
            color: var(--muted);
            margin-bottom: 23px
        }

        .hero-content .btn {
            min-width: 230px
        }

        .feature-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 13px;
            margin-top: 19px
        }

        .mini {
            padding: 17px;
            background: #f4f8fd;
            border: 1px solid #e2ebf5;
            border-radius: 16px;
            text-align: center
        }

        .mini b {
            display: block;
            margin: 7px 0
        }

        .mini small {
            color: var(--muted)
        }

        .reco-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px
        }

        .reco {
            border: 1px solid #d3e1ef;
            border-radius: 17px;
            overflow: hidden;
            background: #fff;
            display: flex;
            flex-direction: column
        }

        .thumb {
            height: 105px;
            background: linear-gradient(155deg, #8ac5ec, #2d6999);
            position: relative;
            overflow: hidden
        }

        .thumb svg {
            width: 100%;
            height: 100%
        }

        .reco-body {
            padding: 18px;
            flex: 1;
            display: flex;
            flex-direction: column
        }

        .reco-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 4px
        }

        .reco h3 {
            font-size: 23px;
            margin: 0
        }

        .rank {
            font-size: 12px;
            border-radius: 100px;
            color: #fff;
            background: #286aa5;
            padding: 3px 9px;
            font-weight: 800;
            white-space: nowrap
        }

        .stat {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            border-bottom: 1px solid #ecf0f5;
            padding: 8px 0;
            font-size: 13px
        }

        .stat b {
            white-space: nowrap
        }

        .reasons {
            font-size: 13px;
            color: #54708b;
            background: #f4f8fd;
            padding: 11px;
            border-radius: 10px;
            margin: 12px 0
        }

        .rbtn {
            margin-top: auto;
            width: 100%;
            padding: 10px;
            border: 1px solid #c6daf1;
            border-radius: 10px;
            background: #eaf4ff;
            color: #165085;
            font-weight: 800
        }

        .rbtn.on {
            background: #173f67;
            color: white
        }

        .score {
            color: #1764a1;
            font-weight: 900
        }

        .notice {
            padding: 12px 15px;
            border-left: 3px solid #5ba1dc;
            background: #f0f7ff;
            color: #4e6c88;
            font-size: 13px;
            border-radius: 6px;
            margin: 20px 0
        }

        .policy-stack {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        .policy {
            border: 1px solid #d9e4f2;
            border-radius: 13px;
            padding: 15px;
            background: #f8fbff;
            display: flex;
            gap: 10px;
            align-items: flex-start
        }

        .policy strong {
            display: block
        }

        .policy small {
            color: var(--muted)
        }

        .policy input {
            accent-color: #246aab;
            width: 18px;
            height: 18px;
            margin-top: 4px
        }

        .map-layout {
            display: grid;
            grid-template-columns: 1.25fr 1fr;
            gap: 16px
        }

        .mapbox {
            border-radius: 15px;
            overflow: hidden;
            background: #e5f1e8;
            min-height: 350px;
            position: relative;
            border: 1px solid #d3e1ef
        }

        .mapbox svg {
            width: 100%;
            height: 100%;
            position: absolute
        }

        .pin {
            position: absolute;
            transform: translate(-50%, -50%);
            border: 2px solid white;
            background: #1d5c97;
            color: white;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            box-shadow: 0 2px 10px #122e5555
        }

        .pin.selected {
            background: #fca832;
            color: #153459
        }

        .tablewrap {
            overflow-x: auto
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px
        }

        th,
        td {
            border-bottom: 1px solid #e0e8f1;
            text-align: left;
            padding: 12px 9px
        }

        th {
            color: #47637e;
            background: #f4f8fc
        }

        .checkgroup {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px
        }

        .option {
            border: 1px solid #d0dfed;
            background: #fff;
            border-radius: 12px;
            padding: 13px;
            text-align: center;
            font-weight: 700
        }

        .option.chosen {
            background: #e9f3ff;
            border-color: #3180ce
        }

        .result {
            border: 1px solid #d7e5ef;
            border-radius: 15px;
            padding: 18px;
            margin-bottom: 14px
        }

        .result.good {
            background: #eaf8f1;
            border-color: #b7e2ca
        }

        .result.bad {
            background: #fff1f1;
            border-color: #f0cccc
        }

        .result.pending {
            background: #fff9e9;
            border-color: #f0dfab
        }

        .result h3 {
            margin: 0 0 9px
        }

        .result .muted {
            color: #506b85;
            font-size: 14px
        }

        .result-detail {
            font-size: 13px;
            margin: 8px 0 0
        }

        .link {
            color: #1a5e9c;
            text-decoration: none;
            font-weight: 750
        }

        .link:hover {
            text-decoration: underline
        }

        .tick {
            display: flex;
            align-items: center;
            gap: 9px;
            padding: 11px 0;
            border-bottom: 1px solid #e6edf4
        }

        .tick input {
            width: 18px;
            height: 18px;
            accent-color: #216ca8
        }

        .empty {
            background: #f6f9fc;
            border: 1px dashed #c7d9e8;
            border-radius: 12px;
            padding: 28px;
            text-align: center;
            color: #6f849b
        }

        .float-menu {
            position: absolute;
            z-index: 5;
            right: 20px;
            top: 64px;
            background: white;
            padding: 12px;
            box-shadow: 0 6px 24px #12345033;
            border: 1px solid #d6e4f2;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            min-width: 190px
        }

        .float-menu button {
            background: none;
            border: 0;
            text-align: left;
            padding: 9px;
            border-radius: 8px;
            color: #18395a;
            font-weight: 700
        }

        .float-menu button:hover {
            background: #eef6ff
        }

        .hidden {
            display: none !important
        }

        .foot {
            color: #7890a7;
            text-align: center;
            font-size: 12px;
            margin: 28px auto
        }

        .badge-demo {
            background: #fff5e0;
            border: 1px solid #eed9a8;
            color: #886421;
            padding: 5px 9px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 850;
            white-space: nowrap
        }

        .head-flex {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-start
        }

        .smallnote {
            font-size: 12px;
            color: #7f90a4
        }

        .box-row {
            border: 1px solid #dce7f2;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            margin: 8px 0
        }

        .modal-back {
            position: fixed;
            inset: 0;
            background: #14294291;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 30;
            padding: 15px
        }

        .modal {
            background: #fff;
            border-radius: 18px;
            padding: 25px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 20px 80px #081e3555
        }

        .modal h2 {
            margin-top: 0
        }

        .svgicon {
            font-size: 24px
        }

        @media(max-width:760px) {
            .shell {
                padding: 9px 10px 35px
            }

            .topbar {
                padding: 0 15px;
                height: 59px;
                margin-bottom: 13px;
                border-radius: 13px
            }

            .brand {
                font-size: 26px
            }

            .nav button:not(.hamb) {
                display: inline-flex
            }

            .panel {
                padding: 20px 17px;
                border-radius: 17px;
                margin: 12px auto
            }

            .formgrid,
            .policy-stack,
            .map-layout {
                grid-template-columns: 1fr
            }

            .reco-grid {
                grid-template-columns: 1fr
            }

            .reco {
                display: grid;
                grid-template-columns: 120px 1fr
            }

            .thumb {
                height: 100%;
                min-height: 180px
            }

            .reco-body {
                padding: 13px
            }

            .reco h3 {
                font-size: 19px
            }

            .reasons {
                margin: 7px 0
            }

            .hero-art {
                height: 230px
            }

            .feature-row {
                grid-template-columns: 1fr
            }

            .mini {
                padding: 12px
            }

            .progress {
                gap: 5px
            }

            .step {
                font-size: 10px;
                gap: 4px
            }

            .num {
                height: 26px;
                width: 26px
            }

            .connector {
                width: 11px
            }

            .checkgroup {
                grid-template-columns: 1fr 1fr
            }

            .mapbox {
                min-height: 290px
            }

            .head-flex {
                flex-wrap: wrap
            }

            .actions .btn {
                min-width: 130px
            }
        }

        @media(min-width:761px) {
            .hamb {
                display: none !important
            }
        }

        @media(max-width:410px) {
            .reco {
                grid-template-columns: 1fr
            }

            .thumb {
                height: 115px;
                min-height: 0
            }

            .reco-body {
                padding: 15px
            }

            .step span:not(.num) {
                display: none
            }

            .connector {
                width: 24px
            }
        }

        /* 목적지 주소 검색: 모바일/데스크톱 공통 */
        .address-search { display:flex; align-items:stretch; gap:9px; }
        .address-input-wrap { flex:1; min-width:0; position:relative; }
        .address-button { white-space:nowrap; padding:10px 15px; }
        .address-suggestions { position:absolute; z-index:25; top:calc(100% + 5px); left:0; right:0; background:#fff; border:1px solid #c9daec; border-radius:12px; box-shadow:0 12px 28px #18375624; max-height:260px; overflow:auto; }
        .address-option { width:100%; border:0; border-bottom:1px solid #e8eff6; padding:11px 13px; display:block; text-align:left; background:#fff; color:var(--ink); }
        .address-option:hover,.address-option:focus { background:#edf6ff; }
        .address-option strong,.address-option small { display:block; }
        .address-option small { color:var(--muted); font-size:12px; margin-top:3px; }
        .nav .home-nav { display:inline-flex; align-items:center; justify-content:center; }
        @media(max-width:520px) { .address-search { flex-direction:column; } .address-button { width:100%; } .address-suggestions { max-height:220px; } }

        /* 3-2. 실제 카카오맵 지도 비교 */
        .real-map { height: 445px; min-height: 340px; border-radius: 16px; overflow: hidden; border: 1px solid #d3e1ef; position:relative; background:#eaf2fa; }
        .map-status { padding: 18px; color: #536c87; font-size: 14px; }
        .map-legend { display:flex; gap:15px; flex-wrap:wrap; align-items:center; margin: 12px 0; font-size:13px; color:#506b85; }
        .map-dot { display:inline-block; vertical-align:middle; width:11px; height:11px; border-radius:50%; background:#2776b3; margin-right:5px; }
        .map-dot.target { background:#ea745a; }
        .kakao-pin { font:inherit; white-space:nowrap; border:2px solid #fff; border-radius:18px; padding:7px 11px; background:#205c98; color:#fff; font-size:12px; font-weight:800; box-shadow:0 3px 13px #102e5250; cursor:pointer; transform:translateY(-12px); }
        .kakao-pin.selected { background:#f6ae45; color:#142d4f; }
        .kakao-pin.target { background:#f26952; font-size:13px; }
        .map-head-row { display:flex; gap:10px; justify-content:space-between; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
        .map-head-row p { margin:0; font-size:13px; color:var(--muted); }
        .map-recenter { border:1px solid #ccddec; border-radius:9px; padding:8px 12px; font-weight:750; background:#fff; color:#204d7a; }
        .map-recenter:hover { background:#eff6fc; }
        @media(max-width:760px) { .real-map { height:365px; min-height:310px; } .map-layout { grid-template-columns:1fr; } }
    </style>
<link rel="stylesheet" href="housing-live.css">
</head>

<body>
    <div class="shell">
        <header class="topbar">
            <button class="brand" onclick="go('home')" aria-label="24.zip 홈">24<span class="roof">⌂</span>zip</button>
            <nav class="nav" aria-label="주 메뉴">
                <button class="home-nav" onclick="go('home')">메인으로</button>
            </nav>
        </header>
        <main id="app" class="main"></main>
        <footer class="foot">24.zip · 서울 청년 1인 가구 주거 탐색 프로토타입<br>※ 주거비는 예시 참고값이며, 이동시간은 사용자가 조회한 실제 경로 결과를 사용합니다.
            지원사업은 공식 공고를 반드시 확인하세요.</footer>
    </div>
    <div id="modalRoot"></div>
    <script defer src="map-config.js"></script>
<script defer src="maps.js"></script>
<script defer src="neighborhood-routes.js"></script>
<script defer src="housing-live.js"></script>
</body>

</html>
